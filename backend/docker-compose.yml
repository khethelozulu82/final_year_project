# Optional: PostgreSQL + Redis for production-like multi-device host
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: themba
      POSTGRES_PASSWORD: themba
      POSTGRES_DB: themba
    ports:
      - "5432:5432"
    volumes:
      - themba_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  themba_pg:
