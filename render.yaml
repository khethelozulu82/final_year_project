databases:
  - name: themba-db
    databaseName: themba
    user: themba
    plan: free

services:
  - type: web
    name: themba-backend
    plan: free
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn themba_project.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: themba-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-frontend.vercel.app"